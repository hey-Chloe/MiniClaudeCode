[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniclaudecode"
version = "5.0.0"
description = "A lightweight autonomous coding agent runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13.0,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[project.scripts]
miniclaude = "miniclaude.cli:main"
miniclaude-eval = "evaluation.runner:main"

[tool.setuptools.packages.find]
include = ["miniclaude*", "runtime*", "security*", "evaluation*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
